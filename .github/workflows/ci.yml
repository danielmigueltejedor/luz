name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# reusable gate workflow in getnodalia/foundation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@57e81c5afd33d40a3810cc742c72fd8111291e9f # foundation main
    with:
      # Same craft-fonts commit as release.yml.
      fonts-repository: getnodalia/foundation
      fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      # A green run takes about 40 min. A hung test is stopped at 80 min, so the log lists the
      # processes still running and the leg fails as timed out instead of being cancelled at 90.
      # xtask ci runs cargo test: the demo scene cache is per process, so nextest is slower here.
      tools: ""
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev libdbus-1-dev
